<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Produção — BR-163 Duplicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<style>
  :root{
    --asphalt:#050B18;
    --asphalt-2:#0D1730;
    --brand:#3E6BFF;
    --brand-deep:#001C57;
    --brand-light:#152242;
    --amber:#F2B33D;
    --orange:#E8792E;
    --ok:#3DD07A;
    --ok-bg:#123825;
    --warn:#F2B33D;
    --warn-bg:#3A2C0E;
    --crit:#FF6B5E;
    --crit-bg:#3A1614;
    --bg:#0A1220;
    --card:#111B33;
    --card-2:#0D162B;
    --border:#22304F;
    --text:#F0F2F7;
    --text-2:#A9B2C6;
    --text-3:#6F7A94;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; padding-bottom:3rem;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}
  .mono{font-family:'Roboto Mono',monospace;}
  header{
    background:linear-gradient(135deg, var(--asphalt) 0%, var(--brand-deep) 130%); color:#fff; padding:1.5rem 1.25rem 1.75rem;
    position:relative;
  }
  header .top{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap;}
  .brand-block{display:flex; align-items:center; gap:1rem;}
  .header-logo{height:42px; width:auto; flex-shrink:0;}
  header h1{font-size:20px; text-transform:uppercase;}
  header .sub{color:#8E9BC4; font-size:13px; margin-top:4px;}
  header .datebox{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:.6rem .9rem; text-align:right;
  }
  header .datebox .d1{font-size:12px; color:#8E9BC4;}
  header .datebox .d2{font-size:16px; font-weight:600; font-family:'Roboto Mono',monospace;}
  .roadline{
    height:6px; margin-top:1.25rem;
    background-image:repeating-linear-gradient(90deg, var(--orange) 0 26px, transparent 26px 46px);
    border-radius:3px; opacity:.9;
  }
  main{max-width:1100px; margin:0 auto; padding:0 1.25rem;}
  section{margin-top:1.75rem;}
  .section-title{font-size:14px; text-transform:uppercase; color:var(--text-2); letter-spacing:.06em; margin-bottom:.75rem; font-weight:600;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px;}
  .entry-form{
    display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; padding:1rem 1.1rem;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12px; color:var(--text-2);}
  .field input, .field select{
    border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:14px;
    font-family:'Inter',sans-serif; background:var(--card-2); color:var(--text); min-width:150px;
  }
  .field.grow{flex:1; min-width:200px;}
  button{
    background:var(--brand); color:#fff; border:none; border-radius:6px;
    padding:9px 18px; font-size:14px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;
  }
  button:hover{background:#5A82FF;}
  button.ghost{
    background:transparent; color:var(--text-2); border:1px solid var(--border); padding:6px 10px; font-size:12px;
  }
  button.ghost:hover{background:var(--card-2); color:var(--text);}

  .cards-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px;
  }
  .pcard{padding:1rem 1.1rem;}
  .pcard .pname{font-size:14px; font-weight:600;}
  .pcard .punit{font-size:12px; color:var(--text-3); margin-left:4px; font-weight:400;}
  .pcard .prow{display:flex; justify-content:space-between; align-items:baseline; margin-top:2px;}
  .pcard .pval{font-family:'Roboto Mono',monospace; font-size:22px; font-weight:500;}
  .pcard .pgoal{font-size:12px; color:var(--text-3); font-family:'Roboto Mono',monospace;}
  .bar-track{
    height:10px; border-radius:5px; background:var(--card-2); margin-top:10px; position:relative; overflow:hidden; border:1px solid var(--border);
  }
  .bar-fill{height:100%; border-radius:5px;}
  .bar-expected{
    position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text-2);
  }
  .pmeta{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--text-2);}
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;
  }
  .badge.ok{background:var(--ok-bg); color:var(--ok);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.crit{background:var(--crit-bg); color:var(--crit);}
  .badge.none{background:var(--card-2); color:var(--text-3);}

  .today-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .tchip{
    background:var(--brand-light); border:1px solid var(--border); border-radius:8px; padding:.6rem .9rem; min-width:150px;
  }
  .tchip .tn{font-size:12px; color:#8FACFF; font-weight:600;}
  .tchip .tv{font-family:'Roboto Mono',monospace; font-size:18px; margin-top:2px;}
  .tchip.empty{background:var(--card-2); color:var(--text-3);}
  .tchip.empty .tn{color:var(--text-3);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);}
  th{color:var(--text-2); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
  td.num{font-family:'Roboto Mono',monospace; text-align:right;}
  th.num{text-align:right;}

  .log-cat{padding:0 0 1rem;}
  .log-cat summary{
    cursor:pointer; padding:.75rem 1.1rem; font-size:14px; font-weight:600; list-style:none;
    display:flex; justify-content:space-between; align-items:center;
  }
  .log-cat summary::-webkit-details-marker{display:none;}
  .log-cat summary .chev{color:var(--text-3); font-size:12px;}
  .log-cat table{padding:0 1.1rem;}
  .log-cat .inner{padding:0 1.1rem 1rem;}
  .delbtn{
    background:none; border:none; color:var(--crit); cursor:pointer; font-size:12px; padding:2px 6px;
  }
  #chartCanvasBox{position:relative; width:100%; height:420px;}
  .chart-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .activity-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(620px,1fr)); gap:14px;}
  .achart-card{padding:1rem 1.1rem;}
  .achart-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .achart-head .an{font-size:14px; font-weight:600;}
  .achart-head .ar{font-size:12px; color:var(--text-3);}
  .achart-canvasbox{position:relative; width:100%; height:270px; margin-top:6px;}
  #stripDate{
    border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:13px;
    font-family:'Roboto Mono',monospace; color:#8FACFF; background:var(--brand-light);
    text-transform:none; letter-spacing:0; font-weight:500; cursor:pointer;
    color-scheme: dark;
  }
  #stripDate::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  #secApontado{ display:none; }
  .tile-row{display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#3A4666 transparent;}
  .tile-row::-webkit-scrollbar{ height:6px; }
  .tile-row::-webkit-scrollbar-track{ background:transparent; }
  .tile-row::-webkit-scrollbar-thumb{ background:#3A4666; border-radius:10px; }
  .tile-btn{ flex:0 0 auto; white-space:nowrap; }
  .tile-btn{
    border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:12px; font-weight:600;
    font-family:'Inter',sans-serif; color:var(--text-2); background:var(--card-2); cursor:pointer;
    text-transform:none; letter-spacing:0; transition:background .12s, color .12s, border-color .12s;
  }
  .tile-btn:hover{ border-color:var(--brand); color:var(--text); }
  .tile-btn.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .hist-canvasbox{position:relative; width:100%; height:280px;}
  .marco-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .marco-chip{
    flex:1; min-width:150px; border-radius:8px; padding:.5rem .7rem; font-size:12px;
    border:1px solid var(--border); background:var(--card-2);
  }
  .marco-chip.active{ border-color:var(--brand); background:var(--brand-light); }
  .marco-chip .mc-label{ font-weight:600; color:var(--text-2); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .marco-chip.active .mc-label{ color:#8FACFF; }
  .marco-chip .mc-val{ font-family:'Roboto Mono',monospace; margin-top:2px; }
  .gap-line{ margin-top:8px; font-size:13px; font-weight:600; }
  .legend-row{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--text-2); margin-bottom:10px;}
  .legend-row span{display:flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}
  .note{font-size:12px; color:var(--text-3); margin-top:.6rem; line-height:1.5;}
  footer{max-width:1100px; margin:2rem auto 0; padding:0 1.25rem; font-size:12px; color:var(--text-3); line-height:1.6;}
  footer a{ color:#8FACFF !important; }
  #printBtn{ display:inline-flex; align-items:center; gap:6px; }

  /* ---- modo claro para geracao de PDF ---- */
  :root.print-light{
    --bg:#FFFFFF; --card:#F8F8F6; --card-2:#F0F0EC; --border:#E4E4DF;
    --text:#1A1C20; --text-2:#4A4D53; --text-3:#6E7177;
    --brand-light:#DCE3F2; --ok-bg:#D9EEDD; --warn-bg:#FBE6BF; --crit-bg:#F6D4CE;
  }
  :root.print-light header{ background:#FFFFFF !important; color:#22252A !important; border-bottom:2px solid var(--brand); }
  :root.print-light header h1{ color:#101426; }
  :root.print-light header .sub{ color:#5B5F66; }
  :root.print-light header .datebox{ background:transparent; border:none; }
  :root.print-light header .datebox .d1{ color:#8A8E94; }
  :root.print-light header .datebox .d2{ color:#101426; }
  :root.print-light .roadline{ display:none; }
  :root.print-light #printBtn{ display:none !important; }
  :root.print-light .badge.ok{ color:#1E8E3E; }
  :root.print-light .badge.warn{ color:#B36B00; }
  :root.print-light .badge.crit{ color:#C0392B; }
  :root.print-light #secSync, :root.print-light #secRitmo,
  :root.print-light #secHistorico, :root.print-light #secApontado{ display:none !important; }
  @media print{
    #printBtn{ display:none !important; }
    #secSync, #secRitmo, #secHistorico, #secApontado{ display:none !important; }
    .roadline{ display:none !important; }
    body{ background:#fff; }
    .achart-canvasbox, .hist-canvasbox{ break-inside:avoid; }
    .card{ break-inside:avoid; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  }
</style>
</head>

const MONTH_YEAR = {year:2026, month:8};

function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', {maximumFractionDigits:2});
}
function pct(n){ return Number(n).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%'; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function isPrintMode(){ return document.documentElement.classList.contains('print-light'); }
function chartTick(){ return isPrintMode() ? '#5B5F66' : '#8891A8'; }
function chartGrid(){ return isPrintMode() ? '#E1E1DC' : '#1C2842'; }
function chartMuted(){ return isPrintMode() ? '#B7B6AC' : '#4A5578'; }

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function workingDaysOfMonth(year, month){
  const days=[];
  const d = new Date(Date.UTC(year, month-1, 1));
  while(d.getUTCMonth() === month-1){
    if(d.getUTCDay() !== 0) days.push(isoDate(d));
    d.setUTCDate(d.getUTCDate()+1);
  }
  return days;
}
const WORK_DAYS = workingDaysOfMonth(MONTH_YEAR.year, MONTH_YEAR.month);
const TOTAL_WORK_DAYS = WORK_DAYS.length;

function workingDayIndex(dateStr){
  const idx = WORK_DAYS.indexOf(dateStr);
  return idx === -1 ? null : idx+1;
}
function saturdaysUpTo(dateStr){
  return WORK_DAYS.filter(d => {
    const dt = new Date(d+'T00:00:00Z');
    return dt.getUTCDay()===6 && d <= dateStr;
  });
}
const ALL_SATURDAYS = WORK_DAYS.filter(d => new Date(d+'T00:00:00Z').getUTCDay()===6);
// Sabados de checagem: todos menos o primeiro (que cai antes do inicio do acompanhamento semanal)
const CHECK_SATS = ALL_SATURDAYS.slice(1);

let ENTRIES = {};
let DATA_SOURCE = 'loading';

async function loadAll(){
  const statusEl = document.getElementById('syncStatus');
  const detailEl = document.getElementById('syncDetail');
  if(statusEl){ statusEl.textContent = 'Sincronizando com o GitHub…'; }

  let ghData = null;
  try{
    const resp = await fetch(GITHUB_RAW_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(resp.ok) ghData = await resp.json();
  }catch(e){ /* offline ou bloqueado - segue pro fallback local */ }

  if(ghData && ghData.entries){
    if(Array.isArray(ghData.categories) && ghData.categories.length){
      CATS = ghData.categories;
    }
    ENTRIES = {};
    CATS.forEach(c => { ENTRIES[c.key] = ghData.entries[c.key] ? {...ghData.entries[c.key]} : {}; });
    try{ for(const c of CATS){ await saveCat(c.key); } }catch(e){ /* cache local e so um bonus, nunca deve travar o carregamento */ }
    DATA_SOURCE = 'github';
    if(statusEl){
      statusEl.textContent = '✓ Sincronizado com o GitHub';
      const upd = ghData.updated_at ? new Date(ghData.updated_at).toLocaleString('pt-BR') : null;
      detailEl.textContent = 'lucianafioramonte/painel-br163-produtividade' + (upd ? ' · atualizado em ' + upd : '');
    }
  } else {
    for(const c of CATS){
      try{
        const r = await window.storage.get('entries:'+c.key, false);
        ENTRIES[c.key] = r && r.value ? JSON.parse(r.value) : {};
      }catch(e){ ENTRIES[c.key] = {}; }
    }
    DATA_SOURCE = 'local';
    if(statusEl){
      statusEl.textContent = '⚠ Não consegui buscar o GitHub agora';
      detailEl.textContent = 'Mostrando a última cópia salva neste navegador.';
    }
  }
}

async function saveCat(key){
  // window.storage so existe dentro do preview de artefato do Claude.ai.
  // Num navegador normal (GitHub Pages, etc.) essa API nao existe - o cache local vira so um bonus, nunca trava o carregamento.
  if(typeof window.storage === 'undefined' || !window.storage) return;
  try{
    await window.storage.set('entries:'+key, JSON.stringify(ENTRIES[key]), false);
  }catch(e){ /* ignora - cache local e so um bonus */ }
}

function monthEntries(key){
  const all = ENTRIES[key] || {};
  const out = {};
  Object.keys(all).forEach(d => {
    if(d.slice(0,7) === `${MONTH_YEAR.year}-${String(MONTH_YEAR.month).padStart(2,'0')}`) out[d]=all[d];
  });
  return out;
}
function accumulated(key, uptoDate){
  const m = monthEntries(key);
  let sum = 0;
  Object.keys(m).forEach(d => { if(!uptoDate || d <= uptoDate) sum += Number(m[d]); });
  return sum;
}

function statusFor(actualPct, expectedPct){
  if(expectedPct <= 0) return 'none';
  const ratio = actualPct / expectedPct;
  if(ratio >= 0.9) return 'ok';
  if(ratio >= 0.75) return 'warn';
  return 'crit';
}
function statusLabel(s){
  return {ok:'No prazo', warn:'Atenção', crit:'Crítico', none:'Sem dados'}[s];
}

function populateForm(){
  document.getElementById('stripDate').value = todayISO();
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'});
}

function renderTodayStrip(){
  const dateInput = document.getElementById('stripDate');
  const t = dateInput.value || todayISO();
  const wrap = document.getElementById('todayStrip');
  wrap.innerHTML = CATS.map(c => {
    const v = (ENTRIES[c.key]||{})[t];
    if(v===undefined) return `<div class="tchip empty"><div class="tn">${c.name}</div><div class="tv">sem apontamento</div></div>`;
    return `<div class="tchip"><div class="tn">${c.name}</div><div class="tv">${fmt(v)} ${c.unit}</div></div>`;
  }).join('');
}

function renderCards(){
  const t = todayISO();
  const idx = workingDayIndex(t) || TOTAL_WORK_DAYS;
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = CATS.map(c => {
    const acc = accumulated(c.key);
    const actualPct = c.goal ? (acc/c.goal*100) : 0;
    const expectedPct = (idx/TOTAL_WORK_DAYS)*100;
    const st = statusFor(actualPct, expectedPct);
    const fillW = Math.min(actualPct,100);
    const expW = Math.min(expectedPct,100);
    const fillColor = st==='ok' ? 'var(--ok)' : st==='warn' ? 'var(--warn)' : st==='crit' ? 'var(--crit)' : 'var(--text-3)';
    return `<div class="card pcard">
      <div class="prow"><span class="pname">${c.name}<span class="punit">${c.resp}</span></span></div>
      <div class="prow" style="margin-top:6px;">
        <span class="pval">${fmt(acc)} <span class="punit">${c.unit}</span></span>
        <span class="pgoal">meta ${fmt(c.goal)} ${c.unit}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${fillW}%; background:${fillColor};"></div>
        <div class="bar-expected" style="left:${expW}%;"></div>
      </div>
      <div class="pmeta">
        <span>Real ${pct(actualPct)} · esperado hoje ${pct(expectedPct)}</span>
        <span class="badge ${st}">${statusLabel(st)}</span>
      </div>
    </div>`;
  }).join('');
}

let chartInstances = {};
let histChartInstance = null;
const MARCO_COLORS = ['#9B7EF0','#E8792E','#3FD0B0','#F2B33D'];

function requiredLineForSaturday(c, satDate){
  const t = todayISO();
  if(satDate > t) return null; // checkpoint ainda nao alcancado
  const idxS = workingDayIndex(satDate);
  const valAtS = accumulated(c.key, satDate);
  const idxEnd = TOTAL_WORK_DAYS;
  return WORK_DAYS.map((d,i)=>{
    const idx = i+1;
    if(idx < idxS) return null;
    if(idx === idxS) return +valAtS.toFixed(1);
    if(idxEnd === idxS) return +valAtS.toFixed(1);
    const frac = (idx - idxS) / (idxEnd - idxS);
    return +(valAtS + (c.goal - valAtS) * frac).toFixed(1);
  });
}

function marcosFor(c){
  // 1o a 3o Marco = pontos intermediarios (3 primeiros sabados de checagem)
  // Meta = valor real da meta mensal, no ultimo dia util do mes (nao prorateado)
  const lastWorkDay = WORK_DAYS[WORK_DAYS.length-1];
  const marcos = CHECK_SATS.slice(0, CHECK_SATS.length-1).map((sat, i) => ({
    date: sat,
    value: c.goal * (workingDayIndex(sat)/TOTAL_WORK_DAYS),
    label: (i+1)+'° Marco'
  }));
  marcos.push({ date: lastWorkDay, value: c.goal, label: 'Meta' });
  return marcos;
}

function buildActivityChart(c){
  const labels = WORK_DAYS.map((d,i)=>i+1);
  const idealLine = WORK_DAYS.map((d,i)=> +(c.goal*(i+1)/TOTAL_WORK_DAYS).toFixed(1));

  const m = monthEntries(c.key);
  const entryDates = Object.keys(m);
  const lastEntryDate = entryDates.length ? entryDates.sort().slice(-1)[0] : null;
  const realLine = WORK_DAYS.map(d => {
    if(!lastEntryDate || d > lastEntryDate) return null;
    return +accumulated(c.key, d).toFixed(1);
  });

  const datasets = [
    { label:'Ritmo ideal', data: idealLine, borderColor:chartMuted(), borderDash:[5,4], borderWidth:1.5, pointRadius:0, order:3 },
    { label:'Realizado', data: realLine, borderColor:c.color, backgroundColor:c.color, borderWidth:2.5, pointRadius:0, tension:.15, spanGaps:false, order:1 }
  ];

  CHECK_SATS.forEach((sat, i) => {
    const line = requiredLineForSaturday(c, sat);
    if(line){
      datasets.push({
        label:`Ritmo necessário após ${sat.split('-').reverse().join('/')}`,
        data: line,
        borderColor: MARCO_COLORS[i % MARCO_COLORS.length],
        borderWidth:1.5,
        borderDash:[2,3],
        pointRadius:0,
        spanGaps:false,
        order:2
      });
    }
  });
  return { labels, datasets };
}

function renderActivityCharts(){
  const wrap = document.getElementById('activityCharts');

  if(typeof Chart === 'undefined'){
    wrap.innerHTML = `<div class="card" style="padding:1rem 1.1rem; color:var(--crit);">
      Não consegui carregar a biblioteca de gráficos (Chart.js). Isso costuma ser falha de rede ou bloqueio de CDN —
      tenta recarregar a página. Os números acima (cards de progresso) continuam válidos mesmo sem os gráficos.
      <div style="margin-top:8px;"><button class="ghost" onclick="location.reload()">Recarregar página</button></div>
    </div>`;
    wrap.dataset.built = '';
    return;
  }

  if(!wrap.dataset.built){
    wrap.className = 'activity-grid';
    wrap.innerHTML = CATS.map(c => `
      <div class="card achart-card">
        <div class="achart-head">
          <div>
            <div class="an">${c.name}</div>
            <div class="ar">${c.resp} · meta ${fmt(c.goal)} ${c.unit}</div>
          </div>
        </div>
        <div class="legend-row" id="legend_${c.key}"></div>
        <div class="achart-canvasbox"><canvas id="pace_${c.key}"></canvas></div>
      </div>
    `).join('');
    wrap.dataset.built = '1';
  }

  CATS.forEach(c => {
   try{
    const { labels, datasets } = buildActivityChart(c);
    const legend = document.getElementById('legend_'+c.key);
    const accToday = accumulated(c.key);
    const marcos = marcosFor(c);
    const t = todayISO();
    let activeIdx = marcos.findIndex(mk => t <= mk.date);
    if(activeIdx === -1) activeIdx = marcos.length - 1;
    const activeMarco = marcos[activeIdx];
    const remaining = activeMarco.value - accToday;

    legend.innerHTML = datasets.map(ds => `<span><span class="dot" style="background:${ds.borderColor}"></span>${ds.label}</span>`).join('') +
      `<span><span class="dot" style="background:#E5473A"></span>Realizado hoje / falta p/ ${activeMarco.label}</span>`;

    const marcoAnnotations = {};
    marcos.forEach((mk,i) => {
      if(mk.date < t) return; // marco ja passou - some do grafico automaticamente
      const isActive = i === activeIdx;
      const clr = isActive ? MARCO_COLORS[i % MARCO_COLORS.length] : chartMuted();
      marcoAnnotations['marco'+i] = {
        type:'line', yMin:mk.value, yMax:mk.value,
        borderColor: clr,
        borderWidth: isActive ? 2.5 : 1,
        borderDash: isActive ? [] : [3,3],
        label:{ display:true, content:mk.label+' ('+mk.date.split('-').reverse().join('/')+'): '+fmt(mk.value)+' '+c.unit,
          position: i % 2 === 0 ? 'start' : 'end',
          backgroundColor: clr,
          color:'#fff', font:{size: isActive ? 10 : 9, weight: isActive ? '600' : '400'}, padding: isActive ? 5 : 3 }
      };
    });
    marcoAnnotations['realLine'] = {
      type:'line', yMin:accToday, yMax:accToday,
      borderColor:'#E5473A', borderWidth:1.5, borderDash:[4,4],
      label:{ display:true, content:'Realizado hoje: '+fmt(accToday)+' '+c.unit, position:'end',
        backgroundColor:'#E5473A', color:'#fff', font:{size:10}, padding:4 }
    };
    marcoAnnotations['gapLabel'] = {
      type:'label',
      xValue: Math.min(Math.max(Math.round(TOTAL_WORK_DAYS*0.55), 3), TOTAL_WORK_DAYS-2),
      yValue: (activeMarco.value + accToday) / 2,
      content: remaining > 0
        ? ['Falta '+fmt(remaining)+' '+c.unit+' p/ '+activeMarco.label+' ('+activeMarco.date.split('-').reverse().join('/')+')']
        : [activeMarco.label+' batido ✓'],
      color:'#fff', font:{size:11, weight:'600'}, backgroundColor:'#E5473A', padding:5, borderRadius:4
    };


    const maxVal = Math.max(c.goal, ...datasets.flatMap(ds => ds.data.filter(v=>v!==null)));
    const ctx = document.getElementById('pace_'+c.key);
    if(chartInstances[c.key]) chartInstances[c.key].destroy();
    chartInstances[c.key] = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets },
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        layout:{ padding:{ top:24 } },
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmt(ctx.parsed.y)+' '+c.unit } },
          annotation:{ annotations: marcoAnnotations }
        },
        scales:{
          x:{ title:{display:true, text:'Dia útil', color:chartTick()}, ticks:{color:chartTick()}, grid:{display:false} },
          y:{ min:0, max: maxVal*1.15, ticks:{color:chartTick(), callback:v=>fmt(v)}, grid:{color:chartGrid()} }
        }
      }
    });
   }catch(err){
     console.error('Falha ao montar o grafico de', c.key, err);
     const box = document.querySelector('#pace_'+c.key)?.parentElement;
     if(box) box.innerHTML = '<div style="font-size:12px; color:var(--crit); padding:8px;">Não consegui montar este gráfico. Os outros continuam normais.</div>';
   }
  });
}

let histSelectedKey = null;

function populateHistSelect(){
  const wrap = document.getElementById('histCatSelect');
  if(!histSelectedKey) histSelectedKey = CATS[0].key;
  wrap.innerHTML = CATS.map(c => `<button type="button" class="tile-btn ${c.key===histSelectedKey?'active':''}" onclick="selectHistCat('${c.key}')">${c.name}</button>`).join('');
}

function selectHistCat(key){
  histSelectedKey = key;
  renderHistChart();
}

function renderHistChart(){
  populateHistSelect();
  const c = CATS.find(x => x.key === histSelectedKey) || CATS[0];
  const m = monthEntries(c.key);
  const dates = Object.keys(m).sort();
  const labels = dates.map(d => d.split('-').reverse().join('/'));
  const values = dates.map(d => Number(m[d]));
  let running = 0;
  const cumulative = values.map(v => { running += v; return +running.toFixed(2); });

  if(typeof Chart === 'undefined') return;
  const ctx = document.getElementById('histChart');
  if(histChartInstance) histChartInstance.destroy();
  histChartInstance = new Chart(ctx, {
    data:{
      labels,
      datasets:[
        { type:'bar', label:'Produção do dia', data: values, backgroundColor: c.color, borderRadius:4, barThickness:28, yAxisID:'y', order:2 },
        { type:'line', label:'Acumulado no mês', data: cumulative, borderColor: MARCO_COLORS[3], backgroundColor:'transparent',
          borderWidth:2.5, pointRadius:3, pointBackgroundColor: MARCO_COLORS[3], tension:.2, yAxisID:'y1', order:1 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{ display:true, position:'top', align:'end', labels:{ color: chartTick(), boxWidth:12, font:{size:11} } },
        tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmt(ctx.parsed.y)+' '+c.unit } }
      },
      scales:{
        x:{ ticks:{color:chartTick()}, grid:{display:false} },
        y:{ position:'left', title:{display:true, text:'Produção do dia', color:chartTick(), font:{size:11}}, ticks:{color:chartTick(), callback:v=>fmt(v)}, grid:{color:chartGrid()} },
        y1:{ position:'right', title:{display:true, text:'Acumulado', color:chartTick(), font:{size:11}}, ticks:{color:chartTick(), callback:v=>fmt(v)}, grid:{display:false} }
      }
    }
  });
}

function renderAll(){
  const steps = [renderTodayStrip, renderCards, renderActivityCharts, renderHistChart];
  for(const step of steps){
    try{ step(); }
    catch(err){ console.error('Falha em', step.name, err); }
  }
}

function generatePDF(){
  document.documentElement.classList.add('print-light');
  document.getElementById('headerLogo').src = LOGO_COLORIDA;
  renderAll(); // redesenha os graficos com as cores do modo claro (sem animacao, ja sai pronto)
  // forca o navegador a pintar a troca de logo/tema antes de abrir a impressao
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
}
window.addEventListener('afterprint', () => {
  document.documentElement.classList.remove('print-light');
  document.getElementById('headerLogo').src = LOGO_BRANCA;
  renderAll();
});

(async function init(){
  populateForm();
  try{ await loadAll(); }
  catch(e){ console.error('loadAll falhou de forma inesperada:', e); }
  renderAll();

  // atualiza sozinho a cada 5 minutos
  setInterval(async () => {
    try{ await loadAll(); }catch(e){ console.error(e); }
    renderAll();
  }, 5*60*1000);

  // e tambem quando a aba volta a ficar visivel (ex: usuario deixou aberta e voltou depois)
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState === 'visible'){
      try{ await loadAll(); }catch(e){ console.error(e); }
      renderAll();
    }
  });
})();
</script>
